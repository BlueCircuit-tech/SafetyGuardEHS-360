services:
  db:
    image: postgres:16-alpine
    container_name: safetyguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safetyguard
      POSTGRES_PASSWORD: safetyguard
      POSTGRES_DB: safetyguard
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - safetyguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetyguard -d safetyguard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  safetyguard-pgdata:
